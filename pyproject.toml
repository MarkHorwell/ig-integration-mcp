[project]
name = "ig-trading-mcp"
version = "0.7.0"
description = "MCP server for the IG REST trading API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mark Horwell" }]
keywords = ["ig", "mcp", "model-context-protocol", "trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.6,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
]

[project.urls]
Homepage = "https://github.com/MarkHorwell/ig-integration-mcp"
Repository = "https://github.com/MarkHorwell/ig-integration-mcp"
Issues = "https://github.com/MarkHorwell/ig-integration-mcp/issues"

[project.scripts]
ig-mcp = "ig_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.8,<1",
    "respx>=0.21,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ig_mcp"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
